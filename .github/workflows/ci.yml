name: Test

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, mbstring, pdo_sqlite, redis, sodium, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  rocket:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme/Rocket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: theme/Rocket/package-lock.json
      - run: npm ci
      - run: npm run build
